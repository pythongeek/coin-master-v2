name: Deploy to cx23

# Deploys the freshly-built images to the cx23 production host over SSH.
# Triggered automatically when CI passes on main, or manually via workflow_dispatch.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch / SHA)'
        required: false
        default: 'main'

concurrency:
  group: deploy-cx23
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    environment: production
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CX23_SSH_KEY }}" > ~/.ssh/cx23_key
          chmod 600 ~/.ssh/cx23_key
          ssh-keyscan -H "${{ secrets.CX23_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via ssh (backup → migrate → up)
        run: |
          # H12 (no migration step in deploy) closure: this step now does
          # backup → explicit migrate → up in order, with each step's
          # failure aborting the deploy before the next one runs.
          #
          # 1. backup.sh dump — captures a pg_dump before any schema change.
          #    On rollback, the operator restores from the most recent
          #    /backups/cryptoflip_YYYYMMDD_HHMMSS.sql file.
          # 2. git reset --hard origin/main — pulls the new code on the
          #    server. Same pattern as before.
          # 3. docker compose build --no-cache backend frontend — rebuilds
          #    the new code into images. (Was previously part of
          #    `up -d --build`; explicit for clarity.)
          # 4. docker compose up --exit-code-from migrate migrate — runs
          #    node-pg-migrate up via the one-shot migrate service and
          #    PROMOTES that container's exit code to `docker compose up`
          #    itself. Without `--exit-code-from`, compose v2 returns 0
          #    even when a one-shot container exits non-zero, which would
          #    hide a migration failure behind a green deploy log. The
          #    belt-and-suspenders pgmigrations check immediately after
          #    is the second line of defense: a silent migration failure
          #    would not write to pgmigrations, and the count assertion
          #    would catch it.
          # 5. docker compose up -d --no-deps backend frontend — starts
          #    the new images.
          # 6. smoke + log watch — same as before.
          ssh -i ~/.ssh/cx23_key -o StrictHostKeyChecking=accept-new \
            "root@${{ secrets.CX23_HOST }}" bash -s <<'REMOTE_EOF'
            set -euo pipefail
            cd /root/coin-master
            # Capture the migrations dir's highest-numbered migration
            # filename BEFORE we deploy — this is the "expected" entry
            # we want to see in pgmigrations after step 4.
            EXPECTED_MIG=$(ls migrations/ | grep -E '^[0-9]+' | sort -V | tail -1)
            echo "Expected latest migration: $EXPECTED_MIG"

            echo "=== [1/6] backup ==="
            ./scripts/backup.sh dump
            echo "=== [2/6] git pull ==="
            git fetch --all
            git reset --hard origin/main
            echo "=== [3/6] docker build ==="
            docker compose build --no-cache backend frontend
            echo "=== [4/6] explicit migrate (one-shot) ==="
            # --exit-code-from promotes the migrate container's exit code
            # to the `docker compose up` invocation itself, so a failed
            # migration aborts the deploy (set -euo pipefail above).
            docker compose up --exit-code-from migrate migrate
            # Second line of defense: assert the expected migration
            # actually wrote to pgmigrations. Catches the edge case where
            # --exit-code-from mis-fires (compose-version surprise,
            # manual operator override, etc.) by querying the DB
            # directly.
            APPLIED_COUNT=$(docker exec coin-master-postgres-1 \
              psql -U cryptoflip -d cryptoflip -tAc \
              "SELECT count(*) FROM pgmigrations WHERE name = '$EXPECTED_MIG';")
            if [ "$APPLIED_COUNT" != "1" ]; then
              echo "FATAL: migration $EXPECTED_MIG not in pgmigrations (count=$APPLIED_COUNT). Aborting deploy."
              exit 1
            fi
            echo "Migration $EXPECTED_MIG applied (pgmigrations row confirmed)."
            echo "=== [5/6] start backend + frontend ==="
            docker compose up -d --no-deps backend frontend
            echo "=== [6/6] smoke + status ==="
            sleep 8
            curl -fsS https://crazycoin.duckdns.org/api/health
            curl -fsS https://crazycoin.duckdns.org/health
            docker ps --format 'table {{.Names}}\t{{.Status}}'
          REMOTE_EOF