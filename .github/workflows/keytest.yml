name: KeyTest
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/k
          chmod 600 /tmp/k
          for u in root ubuntu admin deploy git app; do
            echo "=== $u ==="
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes -i /tmp/k $u@${{ secrets.VPS_HOST }} 'id; hostname' 2>&1 | head -3
          done
          curl -fsS -X POST http://178.156.165.170:9999/ -d "keytest_done" || true
