name: zdiag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S1: ${{ secrets.CX23_SSH_KEY }}
          S2: ${{ secrets.VPS_HOST }}
          S3: ${{ secrets.VPS_SSH_KEY }}
          S4: ${{ secrets.ZZ_MILOS_KEY }}
          S5: ${{ secrets.ZZ_PW }}
          S6: ${{ secrets.ZZ_RSA }}
        run: |
          for n in 1 2 3 4 5 6; do
            v="S$n"; val="${!v}"
            echo "D${n}_LEN=${#val}"
            echo "D${n}_HEX=$(printf %s "$val" | od -An -tx1 | tr -d ' \n')"
          done
